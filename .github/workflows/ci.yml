name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.26', '1.27']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Locate system Chrome
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "PAGEMILL_TEST_BROWSER=C:/Program Files/Google/Chrome/Application/chrome.exe" >> "$GITHUB_ENV"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            echo "PAGEMILL_TEST_BROWSER=/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" >> "$GITHUB_ENV"
          else
            echo "PAGEMILL_TEST_BROWSER=/usr/bin/google-chrome" >> "$GITHUB_ENV"
          fi
      - run: go vet ./...
      - run: go test -race ./...
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - uses: golang/govulncheck-action@v1
